<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../_sdk/widget-sdk.js"></script>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  function draw(p, w, h, scale = 1) {
    Widget.canvas(canvas, { width: w, height: h }, scale);

    const vertical = p.orientation === 'vertical';
    const v = p.sensor ? p.sensor.value : null;
    const f = Widget.fraction(v, Number(p.min), Number(p.max));
    const label = p.label || (p.sensor ? p.sensor.name : '');
    const valueText = Widget.format(p.sensor, p.decimals) + (p.sensor && p.sensor.unit ? ' ' + p.sensor.unit : '');
    const family = `"${p.font || 'Segoe UI'}", "Segoe UI", system-ui, sans-serif`;

    // Texto: na horizontal, legenda e valor numa linha por cima; na vertical,
    // valor por cima e legenda por baixo.
    const fs = Math.max(9, Math.min(14, Math.round((vertical ? w * 0.5 : h * 0.4))));
    ctx.font = `${fs}px ${family}`;
    ctx.fillStyle = p.textColor;
    ctx.textBaseline = 'top';
    let top = 0, bottom = 0;
    if (vertical) {
      ctx.textAlign = 'center';
      if (p.showValue) { ctx.fillText(valueText, w / 2, 0, w); top = fs + 4; }
      if (label) { ctx.textBaseline = 'bottom'; ctx.fillText(label, w / 2, h, w); ctx.textBaseline = 'top'; bottom = fs + 4; }
    } else if (p.showValue || label) {
      ctx.textAlign = 'left';
      if (label) ctx.fillText(label, 0, 0, w * 0.6);
      ctx.textAlign = 'right';
      if (p.showValue) ctx.fillText(valueText, w, 0, w * 0.6);
      top = fs + 4;
    }

    const area = vertical ? { x: 0, y: top, w, h: h - top - bottom } : { x: 0, y: top, w, h: h - top };
    const n = Math.max(1, Math.min(60, Math.round(Number(p.segments) || 1)));
    const gap = n > 1 ? Math.max(0, Math.min(12, Number(p.gap) || 0)) : 0;
    const len = vertical ? area.h : area.w;     // eixo ao longo do qual crescem os segmentos
    const thick = vertical ? area.w : area.h;
    const seg = (len - gap * (n - 1)) / n;
    if (seg <= 0 || thick <= 0) return;
    const radius = p.rounded ? Math.min(thick, seg) / 2 : 0;

    const rect = (i, from = 0, to = 1) => {
      const pos = i * (seg + gap);
      // Na vertical os segmentos crescem de baixo para cima.
      const a = pos + seg * from, b = pos + seg * to;
      if (vertical) return [area.x, area.y + len - b, thick, b - a];
      return [area.x + a, area.y, b - a, thick];
    };
    const fill = (r, color, rad) => {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(r[0], r[1], r[2], r[3], rad);
      ctx.fill();
    };

    const lit = n === 1 ? 0 : Math.round(f * n);
    for (let i = 0; i < n; i++) {
      fill(rect(i), p.trackColor, radius);
      const on = n === 1 ? f > 0 : i < lit;
      if (!on || v == null) continue;
      const t = p.colorBy === 'value' || n === 1 ? f : i / (n - 1);
      const color = Widget.mix(p.color, p.colorHigh, t);
      if (n === 1) {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(...rect(0), radius);
        ctx.clip();
        fill(rect(0, 0, f), color, 0);
        ctx.restore();
      } else {
        fill(rect(i), color, radius);
      }
    }
  }

  Widget.onUpdate((p, { size, scale }) => draw(p, size.width, size.height, scale));
</script>
</body>
</html>
