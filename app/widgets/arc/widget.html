<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
<script src="../_sdk/widget-sdk.js"></script>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const SEGMENTS = 96;   // passos do gradiente ao longo de uma volta completa

  Widget.onUpdate((p, { size }) => {
    const { width: w, height: h } = size;
    canvas.width = w;
    canvas.height = h;
    ctx.clearRect(0, 0, w, h);

    const t = Math.max(1, Number(p.thickness) || 1);
    const r = Math.max(0, Math.min(w, h) / 2 - t / 2);
    const cx = w / 2, cy = h / 2;
    let a0 = Number(p.start) || 0, a1 = Number(p.end) || 0;
    if (a1 < a0) [a0, a1] = [a1, a0];
    const full = a1 - a0 >= 360;
    if (full) a1 = a0 + 360;
    // 0° no topo, a rodar no sentido dos ponteiros do relógio.
    const rad = (deg) => ((deg - 90) * Math.PI) / 180;

    ctx.lineWidth = t;
    if (p.color === p.colorEnd) {
      ctx.strokeStyle = p.color;
      ctx.lineCap = p.round && !full ? 'round' : 'butt';
      ctx.beginPath();
      ctx.arc(cx, cy, r, rad(a0), rad(a1));
      ctx.stroke();
    } else {
      // Gradiente ao longo do arco: segmentos curtos, cada um com a sua cor.
      const n = Math.max(2, Math.ceil((SEGMENTS * (a1 - a0)) / 360));
      const step = (a1 - a0) / n;
      ctx.lineCap = 'butt';
      for (let i = 0; i < n; i++) {
        ctx.strokeStyle = Widget.mix(p.color, p.colorEnd, (i + 0.5) / n);
        ctx.beginPath();
        // Sobreposição mínima para não aparecerem riscas entre segmentos.
        ctx.arc(cx, cy, r, rad(a0 + i * step), rad(a0 + (i + 1) * step + (i < n - 1 ? 0.6 : 0)));
        ctx.stroke();
      }
      if (p.round && !full) {
        for (const [deg, color] of [[a0, p.color], [a1, p.colorEnd]]) {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(cx + r * Math.cos(rad(deg)), cy + r * Math.sin(rad(deg)), t / 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    document.body.style.opacity = Widget.opacity(p.opacity);
  });
</script>
</body>
</html>
