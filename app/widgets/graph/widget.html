<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../_sdk/widget-sdk.js"></script>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  function draw(p, w, h, scale = 1) {
    const n = Math.max(10, Number(p.points) || 60);
    const history = p.sensor ? p.sensor.history.slice(-n) : [];
    Widget.canvas(canvas, { width: w, height: h }, scale);

    let min = Number(p.min), max = Number(p.max);
    const vals = history.filter((v) => v != null);
    if (p.autoScale && vals.length) {
      min = Math.min(...vals);
      max = Math.max(...vals);
      const pad = (max - min) * 0.1 || 1;
      min -= pad;
      max += pad;
    }
    const y = (v) => h - 1 - Widget.fraction(v, min, max) * (h - 2);

    ctx.strokeStyle = p.gridColor;
    ctx.lineWidth = 1;
    for (let k = 1; k < 4; k++) {
      const gy = Math.round((h * k) / 4) + 0.5;
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
    }

    const step = w / (n - 1);
    const pts = history.map((v, i) => [w - (history.length - 1 - i) * step, v]).filter(([, v]) => v != null);
    if (pts.length > 1) {
      ctx.beginPath();
      pts.forEach(([x, v], i) => (i ? ctx.lineTo(x, y(v)) : ctx.moveTo(x, y(v))));
      if (p.fill) {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, p.color + '66');
        grad.addColorStop(1, p.color + '00');
        ctx.save();
        ctx.lineTo(pts[pts.length - 1][0], h);
        ctx.lineTo(pts[0][0], h);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();
        ctx.beginPath();
        pts.forEach(([x, v], i) => (i ? ctx.lineTo(x, y(v)) : ctx.moveTo(x, y(v))));
      }
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    const fs = Math.max(9, Math.min(14, Math.round(h * 0.22)));
    ctx.font = `${fs}px "Segoe UI", system-ui, sans-serif`;
    ctx.fillStyle = p.textColor;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText(p.label || '', 2, 1);
    ctx.textAlign = 'right';
    ctx.fillText(Widget.format(p.sensor, p.decimals) + (p.sensor ? ' ' + p.sensor.unit : ''), w - 2, 1);
  }

  Widget.onUpdate((p, { size, scale }) => draw(p, size.width, size.height, scale));
</script>
</body>
</html>
