<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #time { font-weight: 300; line-height: 1; }
  #date { margin-top: .2em; }
</style>
</head>
<body>
  <div id="time"></div>
  <div id="date"></div>
<script src="../_sdk/widget-sdk.js"></script>
<script>
  const timeEl = document.getElementById('time');
  const dateEl = document.getElementById('date');
  let props = null;
  let size = { width: 220, height: 120 };
  let locale = 'en-GB';

  function render() {
    if (!props) return;
    const now = new Date();
    const time = now.toLocaleTimeString(locale, {
      hour: '2-digit', minute: '2-digit', ...(props.seconds ? { second: '2-digit' } : {}),
    });
    if (timeEl.textContent !== time) timeEl.textContent = time;
    let date = now.toLocaleDateString(locale, { weekday: 'long', day: 'numeric', month: 'long' });
    date = date.charAt(0).toUpperCase() + date.slice(1);
    if (dateEl.textContent !== date) dateEl.textContent = date;
  }

  Widget.onUpdate((p, info) => {
    props = p;
    size = info.size;
    locale = Widget.locale(info);
    timeEl.style.color = p.color;
    dateEl.style.color = p.dateColor;
    dateEl.style.display = p.showDate ? '' : 'none';
    render();

    const ratio = p.showDate ? 0.55 : 0.8;
    let fs = Math.round(size.height * ratio);
    timeEl.style.fontSize = fs + 'px';
    while (fs > 8 && timeEl.scrollWidth > size.width) timeEl.style.fontSize = (--fs) + 'px';
    dateEl.style.fontSize = Math.max(9, Math.round(size.height * 0.14)) + 'px';
  });

  setInterval(render, 1000);
</script>
</body>
</html>
