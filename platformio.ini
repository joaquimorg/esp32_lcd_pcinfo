; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Ecrã USB: recebe retângulos de pixels do PC (app/ ou tools/usb_display_bench.py)
;
; Cada placa + ecrã é um ambiente. O driver do ecrã e os pinos são definidos em
; tempo de compilação (TFT_eSPI) e o transporte por -D LCD_TRANSPORT_UART:
;   0 (omisso) = USB nativo do ESP32-S2 (CDC próprio);  1 = UART via chip USB-série.
;   pio run -e <ambiente> [-t upload]
[platformio]
default_envs = lolin_s2_mini

; LOLIN S2 Mini + LCD ST7789 240x320 (USB nativo)
[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
; Sem Serial por USB: o firmware regista a sua própria interface CDC
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D USBD_LCD_DMA=0
	-D USER_SETUP_LOADED
	-D ST7789_DRIVER
	-D TFT_INVERSION_OFF
	-D TFT_MISO=36
	-D TFT_MOSI=35
	-D TFT_SCLK=33
	-D TFT_CS=37
	-D TFT_DC=39
	-D TFT_RST=18
	-D LOAD_GLCD=1
	-D TOUCH_CS=-1
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D TFT_RGB_ORDER=TFT_BGR
	-D SPI_FREQUENCY=80000000


; ESP32 CYD 2.8" ("ESP32-2432S028R"): ESP32 clássico, sem USB nativo (CH340/CP210x),
; LCD ILI9341 240x320 em HSPI e backlight no GPIO 21. O toque (XPT2046) não é usado.
[cyd28_common]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
	-D LCD_TRANSPORT_UART=1
	-D USER_SETUP_LOADED
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D USE_HSPI_PORT
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D TOUCH_CS=-1
	-D LOAD_GLCD=1
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D SPI_FREQUENCY=40000000

; CYD com ILI9341 (a versão mais comum)
[env:cyd28_ili9341]
platform = ${cyd28_common.platform}
board = ${cyd28_common.board}
framework = ${cyd28_common.framework}
build_flags =
	${cyd28_common.build_flags}
	-D ILI9341_2_DRIVER

; CYD com ST7789 (algumas variantes com a mesma placa e dois conectores USB).
; Se as cores vierem invertidas, troca TFT_INVERSION_OFF por TFT_INVERSION_ON.
[env:cyd28_st7789]
platform = ${cyd28_common.platform}
board = ${cyd28_common.board}
framework = ${cyd28_common.framework}
build_flags =
	${cyd28_common.build_flags}
	-D ST7789_DRIVER
	-D TFT_INVERSION_OFF
	-D TFT_RGB_ORDER=TFT_BGR


; Waveshare ESP32-S3-Touch-AMOLED-2.06: ESP32-S3R8 (USB nativo, 8 MB PSRAM), AMOLED
; 410x502 com CO5300 por QSPI. Usa a biblioteca "GFX Library for Arduino" em vez do
; TFT_eSPI (lcd.h). Pinos do pin_config.h oficial da Waveshare. O toque (FT3168), o
; PMIC AXP2101 e o resto da placa não são usados. Mantém o core 2.x do Arduino: o
; transporte USB do firmware usa o TinyUSB dessa versão.
[env:waveshare_amoled_206]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
; Como na S2 Mini: o upload reinicia a placa (abre a porta a 1200 baud) e espera que volte.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
lib_deps = moononournation/GFX Library for Arduino@1.6.0
lib_ignore = TFT_eSPI
build_unflags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D BOARD_HAS_PSRAM
	-D LCD_USB_PID=0x80C3
	-D USBD_LCD_DMA=0
	-D LCD_BACKEND_GFX=1
	-D LCD_WIDTH=410
	-D LCD_HEIGHT=502
	; deslocamento das colunas do painel de 410 px no CO5300 (o demo da Waveshare usa 22;
	; o wiki não usa nenhum). Tem de ser par: o alinhamento dos retângulos conta com isso.
	-D LCD_COL_OFFSET=22
	-D LCD_SDIO0=4
	-D LCD_SDIO1=5
	-D LCD_SDIO2=6
	-D LCD_SDIO3=7
	-D LCD_SCLK=11
	-D LCD_CS=12
	-D LCD_RST=8
